buildscript {
    ext {
        vXnat = "1.11.0-SNAPSHOT"
        pluginAppName = "XNAT Container Service"
    }
}

plugins {
    id "idea"
    id "java"
    id "maven-publish"
    id "com.palantir.git-version" version "3.3.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
}

group "org.nrg.xnatx.plugins"
version "3.9.0-SNAPSHOT"

java {
    // Build on JDK 21, not the Gradle launcher JVM (JDK 25). JDK 22+ tightened zip64 CEN validation and
    // rejects old jars on the compile classpath (e.g. aspectjweaver-1.8.10) with "Invalid CEN header".
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = 21
    targetCompatibility = 21
}

def vMockito = "5.7.0"
def vJavassist = "3.21.0-GA"
def vAwaitility = "2.0.0"

repositories {
    mavenLocal {
        // The plain ehcache-3.10.8.jar sits in mavenLocal and shadows the 'jakarta' classifier variant
        // (which is only published on Central), so a transitive org.ehcache:ehcache:3.10.8:jakarta can't
        // resolve. Exclude the group here so ehcache resolves from Central/jfrog instead.
        content { excludeGroup "org.ehcache" }
    }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom("org.nrg:parent:${vXnat}") {
            bomProperties([
                    "javassist.version": vJavassist
            ])
        }
    }
}

def vDockerJava = "3.4.0.1"
def vAutoValue = "1.5.4"
def vKubernetesClient = "15.0.+"
def vPowerMock = "2.0.9"
// importedProperties not available from Gradle java-platform BOM — versions managed by BOM directly

// Use this configuration to put dependencies into the fat jar
configurations {
    implementation.extendsFrom(implementAndInclude)
    // NOTE on commons-io: XNAT provides commons-io 2.21.0 (required by commons-fileupload2). docker-java
    // drags in an older 2.15.1 transitively, which we still WANT on the compile classpath (the source uses
    // FileUtils/FilenameUtils) — but must NOT bundle into the fat jar, or it shadows XNAT's 2.21.0 and
    // breaks commons-fileupload2 DiskFileItemFactory with IllegalAccessError, taking Turbine's
    // fulcrum-upload service (all /app screens) down on Tomcat 10. We can't exclude it here: an exclude on
    // implementAndInclude propagates through extendsFrom to compileClasspath and would break compilation.
    // Instead the fatJar task strips org/apache/commons/io/** from the assembled bundle (see below).
    all {
        resolutionStrategy.force "org.mockito:mockito-core:${vMockito}"
        resolutionStrategy.force "com.github.docker-java:docker-java-api:${vDockerJava}"

        exclude group: "org.bouncycastle"
    }
}

tasks.withType(Test).configureEach {
//        jvmArgs("--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED")
        jvmArgs("--add-opens", "java.xml/jdk.xml.internal=ALL-UNNAMED")
        jvmArgs("--add-opens", "java.base/java.lang=ALL-UNNAMED")
    }

// Spring Framework 6 (Spring MVC in XNAT 1.11.0) no longer discovers method parameter names from
// bytecode debug info, so @RequestParam / @PathVariable arguments that omit an explicit name resolve
// only when classes are compiled with javac -parameters. XNAT core sets this in its build convention
// (buildSrc/.../buildlogic.java-common-conventions.gradle); this plugin has its own build, so it must
// opt in too. Without it, e.g. GET /xapi/commands/available throws IllegalArgumentException ("Name for
// argument of type [String] not specified … Ensure that the compiler uses the '-parameters' flag") -> 500.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

dependencies {
    annotationProcessor "org.nrg:framework"
    annotationProcessor "com.google.auto.value:auto-value:${vAutoValue}"

    compileOnly "com.google.auto.value:auto-value:${vAutoValue}"

    implementAndInclude "com.github.docker-java:docker-java-core:${vDockerJava}"
    implementAndInclude "com.github.docker-java:docker-java-transport-okhttp:${vDockerJava}"

    implementAndInclude ("io.kubernetes:client-java:${vKubernetesClient}") {
        exclude group: "com.google.code.gson"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "commons-codec", module: "commons-codec"
        exclude group: "commons-io", module: "commons-io"
        exclude group: "org.apache.commons", module: "commons-compress"
        exclude group: "org.apache.commons", module: "commons-lang3"
        exclude group: "org.slf4j"
        exclude group: "org.bouncycastle"
        exclude group: "org.yaml", module: "snakeyaml"
        exclude group: "com.squareup.okhttp3", module: "okhttp" // Included via docker-java-transport-okhttp
    }
    implementAndInclude ("io.kubernetes:client-java-api:${vKubernetesClient}") {  // Explicitly including to exclude transitive deps
        exclude group: "com.google.code.gson"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.apache.commons", module: "commons-lang3"
    }
    implementAndInclude ("io.kubernetes:client-java-api-fluent:${vKubernetesClient}") {  // To use Builder classes
        exclude group: "com.google.code.gson"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.apache.commons", module: "commons-lang3"
    }

    implementAndInclude "org.ahocorasick:ahocorasick:0.6.3"

    implementation ("org.nrg.xnat:web") {
        transitive = false
    }
    implementation "org.nrg:framework"
    implementation ("org.nrg.xdat:core") {
        transitive = false
    }
    // xnat-data-models merged into org.nrg.xnat:web in monorepo — no longer a separate artifact
    implementation "org.nrg:prefs"
    implementation ("org.nrg:notify") {
        exclude group: "cglib"
    }
    implementation ("org.nrg:config") {
        exclude group: "cglib"
    }
    implementation ("org.nrg:automation") {
        exclude group: "org.python"
        exclude group: "cglib"
    }

    implementation ("cglib:cglib:2.2.2") {
        exclude group: "asm"
    }
    implementation "org.springframework:spring-beans"
    implementation "org.springframework:spring-context"
    implementation "org.springframework:spring-core"
    implementation "org.springframework:spring-tx"
    implementation "org.springframework:spring-web"
    implementation "org.springframework:spring-webmvc"
    implementation "org.springframework:spring-jms"
    implementation "org.springframework:spring-messaging"
    implementation "jakarta.jms:jakarta.jms-api"
    implementation "org.apache.activemq:activemq-all"
    implementation "org.aspectj:aspectjweaver"

    implementation "io.swagger:swagger-annotations:1.5.20"

    implementation "org.hibernate:hibernate-core"
    implementation "com.vladmihalcea:hibernate-types-55"
    // ehcache 'jakarta' classifier: the default jar parses its XML config with javax JAXB and breaks on
    // Tomcat 10; the jakarta variant is required. Declared explicitly (as XNAT core does) so it resolves
    // from Central rather than being shadowed by the plain jar in mavenLocal, which arrives transitively
    // via org.nrg:framework's module metadata.
    implementation "org.ehcache:ehcache:3.10.8:jakarta"

    implementation "com.fasterxml.jackson.core:jackson-annotations"
    implementation "com.fasterxml.jackson.core:jackson-core"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.module:jackson-module-jaxb-annotations"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-guava"

    implementation "com.jayway.jsonpath:json-path"

    implementation "org.slf4j:slf4j-api"
    implementation "org.slf4j:slf4j-log4j12"

    implementation "commons-lang:commons-lang"

    implementation "jakarta.inject:jakarta.inject-api"
    implementation "jakarta.servlet:jakarta.servlet-api"

    implementation ("org.apache.turbine:turbine") {
        transitive = false
    }
    implementation ("org.apache.velocity:velocity-engine-core") {
        transitive = false
    }
    implementation ("xalan:xalan:2.7.2") {
        transitive = false
    }

    implementation group: 'javax.interceptor', name: 'javax.interceptor-api', version: '1.2.2'

    runtimeOnly "commons-codec:commons-codec"
    runtimeOnly "commons-io:commons-io"
    runtimeOnly "org.apache.commons:commons-compress"
    runtimeOnly "org.apache.commons:commons-lang3"
    runtimeOnly "org.apache.httpcomponents:httpclient"
    runtimeOnly "com.google.code.gson:gson"
    runtimeOnly "com.google.code.findbugs:jsr305"
    runtimeOnly "org.yaml:snakeyaml:1.15+"

    testImplementation "junit:junit:4.13.2"
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.hamcrest:hamcrest-library"
    testImplementation "org.springframework:spring-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.springframework.security:spring-security-config"
    testImplementation "org.mockito:mockito-core:${vMockito}"
    testImplementation 'org.mockito:mockito-junit-jupiter:5.0.0'  // JUnit 5 integration for Mockito

    testImplementation "jakarta.servlet:jakarta.servlet-api"
    testImplementation "com.h2database:h2"
    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.springframework:spring-orm"
    testImplementation "org.apache.commons:commons-dbcp2"
    testImplementation "commons-net:commons-net"
    testImplementation "org.awaitility:awaitility:${vAwaitility}"
    testImplementation "org.testcontainers:junit-jupiter:1.19.0"
    testImplementation "org.testcontainers:postgresql:1.19.0"
}

test {
    useJUnitPlatform()
    systemProperty "integration", System.getProperty('integration') == "true"
}

tasks.register ( 'unitTest', Test ) {
    useJUnitPlatform()

    systemProperties['integration'] = "false"
    test
}

tasks.register ( 'integrationTest', Test ) {
    useJUnitPlatform()
    systemProperties['integration'] = "true"
    test
}

// Pulls in the Jenkins BUILD_NUMBER environment variable if available.
def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: "Manual"
def isDirty, branchName, gitHash, gitHashFull, commitDistance, lastTag, isCleanTag

try {
    def gitDetails = versionDetails()
    isDirty = gitVersion().endsWith ".dirty"
    branchName = gitDetails.branchName ?: "Unknown"
    gitHash = gitDetails.gitHash
    gitHashFull = gitDetails.gitHashFull
    commitDistance = gitDetails.commitDistance
    lastTag = gitDetails.lastTag
    isCleanTag = gitDetails.isCleanTag
} catch (IllegalArgumentException e) {
    logger.info "Got an error trying to read VCS metadata from git. It's possible this project is not under VCS control. Using placeholder values for manifest entries."
    isDirty = true
    branchName = "Unknown"
    gitHash = "None"
    gitHashFull = "None"
    commitDistance = 0
    lastTag = "None"
    isCleanTag = false
}

ext.gitManifestAttrs = [
        "Application-Name"        : pluginAppName,
        "Build-Date"              : buildDate,
        "Build-Number"            : buildNumber,
        "Implementation-Version"  : project.version,
        "Implementation-Sha"      : gitHash,
        "Implementation-Sha-Full" : gitHashFull,
        "Implementation-Commit"   : commitDistance,
        "Implementation-LastTag"  : lastTag,
        "Implementation-Branch"   : branchName,
        "Implementation-CleanTag" : isCleanTag,
        "Implementation-Dirty"    : isDirty
]

task fatJar(type: Jar) {
    zip64 true
    archiveClassifier.set("fat")
    from {
        configurations.implementAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        // XNAT provides commons-io 2.21.0 (needed by commons-fileupload2). Do not bundle docker-java's
        // transitive 2.15.1 — it shadows XNAT's and breaks fulcrum-upload's DiskFileItemFactory
        // (IllegalAccessError), taking Turbine (all /app screens) down on Tomcat 10.
        exclude "org/apache/commons/io/**"
    }
    duplicatesStrategy "exclude"
    manifest {
        attributes gitManifestAttrs
    }
    with jar
}

sourceSets.main.java {
    srcDir "generated"
    exclude "*/AutoValue.java"
}

jar{
    manifest {
        attributes gitManifestAttrs
    }
    doLast {
        if (!gradle.taskGraph.hasTask(":fatJar")) {
            logger.warn 'WARNING: You should generally run fatJar instead of jar task for this plugin'
        }
    }
}

task sourceJar(type: Jar, dependsOn: classes) {
    archiveClassifier.set("sources")
    manifest {
        attributes gitManifestAttrs
    }
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set("javadoc")
    manifest {
        attributes gitManifestAttrs
    }
    from javadoc.destinationDir
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifacts {
                artifact sourceJar
                artifact javadocJar
                artifact fatJar
            }

            pom.withXml {
                def root = asNode()
                root.appendNode("name", pluginAppName)
                root.appendNode("description", "XNAT plugin for launching and managing containers.")
                root.appendNode("url", "https://github.com/nrgxnat/container-service")
                root.appendNode("inceptionYear", "2016")

                def scm = root.appendNode("scm")
                scm.appendNode("url", "https://github.com/nrgxnat/container-service")
                scm.appendNode("connection", "scm:https://github.com/nrgxnat/container-service.git")
                scm.appendNode("developerConnection", "scm:git@github.com:nrgxnat/container-service")

                def license = root.appendNode("licenses").appendNode("license")
                license.appendNode("name", "Simplified BSD 2-Clause License")
                license.appendNode("url", "https://xnat.org/about/license.php")
                license.appendNode("distribution", "repo")

                def developers = root.appendNode("developers")
                def flavin = developers.appendNode("developer")
                flavin.appendNode("id", "jflavin")
                flavin.appendNode("name", "John Flavin")
                flavin.appendNode("email", "jflavin@wustl.edu")

                def kelsey = developers.appendNode("developer")
                kelsey.appendNode("id", "kelseym")
                kelsey.appendNode("name", "Matt Kelsey")
                kelsey.appendNode("email", "kelseym@wustl.edu")

                def will = developers.appendNode("developer")
                will.appendNode("id", "hortonw")
                will.appendNode("name", "Will Horton")
                will.appendNode("email", "hortonw@wustl.edu")
            }
        }
    }
    repositories {
        maven {
            name = "XNAT_Artifactory"
            url = project.version.toString().endsWith("-SNAPSHOT")
                ? "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local"
                : "https://nrgxnat.jfrog.io/nrgxnat/libs-release-local"
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars (Gradle maps
            // these to project properties). Local devs can set artifactoryUser/Token in
            // ~/.gradle/gradle.properties. Mirrors monorepo's buildSrc convention.
            credentials {
                username = (project.findProperty("artifactoryUser")  ?: System.getenv("ARTIFACTORY_USER"))  ?: ""
                password = (project.findProperty("artifactoryToken") ?: System.getenv("ARTIFACTORY_TOKEN")) ?: ""
            }
        }
    }
}

def propertyWithDefault(def String property, def Object value) {
    hasProperty(property) ? getProperty(property) : value
}

